[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tianji-provider"
version = "0.7.2"
description = "Timestamp-aligned Tianji/Marvin Pro MCAP source for LeTools"
requires-python = ">=3.12"
dependencies = ["letools>=0.1.0", "mcap>=1.3,<2", "mcap-ros2-support>=0.5.7,<0.6", "scipy>=1.14,<2", "PyYAML>=6,<7", "mcap-ops @ git+https://github.com/XieWeikai/mcap-ops.git@4ae4c0ba1a77d7b911e7088d317fbfed09b25421"]

[project.entry-points."letools.source_providers"]
tianji = "tianji_provider.provider:provider"

[project.scripts]
tianji-provider = "tianji_provider.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tianji_provider"]

[tool.hatch.metadata]
allow-direct-references = true
